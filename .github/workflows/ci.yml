name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish
        run: dotnet publish Search.Windows.csproj -c Release -warnaserror -o publish

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Smoke test
        run: python test_smoke.py publish/browse.exe
