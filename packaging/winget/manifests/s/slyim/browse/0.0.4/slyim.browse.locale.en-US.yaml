ReleaseNotes: >-
  Find bar, per-site zoom, print and save page, downloads flyout, crash recovery,
  fullscreen/F11, EasyList/EasyPrivacy/uBlock/Peter Lowe ad and tracker blocking with
  a per-site shield, Windows system icons, tab animations, collapsible tab rail,
  focus mode, and settings as a browse://settings tab.
