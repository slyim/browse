ShortDescription: Small, fast Windows web browser built with WinForms and system WebView2.
Description: >-
  Windows port of Office Commun's Search, built with WinForms on .NET 10 and the
  system Microsoft Edge WebView2 runtime. Features vertical or top tabs, built-in
  ad/tracker blocking, link cleaning, sleeping tabs, session restore, and one-time
  read-only page sharing without bundling Chromium, Electron, or .NET.
